name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  PB_VERSION: 0.40.6

jobs:
  app:
    name: App tests & types
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npx tsc --noEmit

  server:
    name: Schema & access rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download PocketBase
        run: |
          cd server
          curl -sSL -o pb.zip "https://github.com/pocketbase/pocketbase/releases/download/v${PB_VERSION}/pocketbase_${PB_VERSION}_linux_amd64.zip"
          unzip -q pb.zip pocketbase
      - name: Start server with migrations
        run: |
          cd server
          ./pocketbase serve --http=127.0.0.1:8090 --dir=./pb_data --migrationsDir=./pb_migrations --hooksDir=./pb_hooks &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8090/api/health && break; sleep 1; done
      - name: Access rule tests
        run: node server/tests/access-rules.mjs
